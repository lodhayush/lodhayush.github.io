name: Update Citation Counts

# Syncs citation counts and new papers from Google Scholar (bin/update_scholar.py).
# Scholar sends no notifications, so "whenever something changes on Scholar"
# means polling: once a day, plus whenever papers.bib or the sync itself changes.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  push:
    branches:
      - main
    paths:
      - "_bibliography/papers.bib"
      - "bin/update_scholar.py"
      - ".github/workflows/update-citations.yml"
  workflow_dispatch:

permissions:
  contents: write # commit refreshed counts and new papers
  actions: write # start the deploy workflow after committing

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pyyaml

      # Exits non-zero without writing anything if Scholar blocks the runner,
      # so a red run means "Scholar refused", and the last good counts stay live.
      - name: Sync with Google Scholar
        run: timeout 600 python bin/update_scholar.py

      - name: Commit, push, and redeploy if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add _data/citations.yml _bibliography/papers.bib
          if git diff --staged --quiet; then
            echo "ℹ️ Nothing changed on Google Scholar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: Sync citation counts and papers from Google Scholar"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN never trigger other workflows, so the
          # deploy has to be started explicitly or the new counts never go live.
          gh workflow run deploy.yml --ref main
          echo "✅ Synced from Google Scholar and started a deploy." >> "$GITHUB_STEP_SUMMARY"
